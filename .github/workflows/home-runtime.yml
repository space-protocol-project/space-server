name: Домашний сервер без Docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия кандидата без публикации, например v0.7.15
        type: string
        default: ''
      app_ref:
        description: Коммит приложения для проверки обновления и восстановления
        type: string
        default: ''
  push:
    tags: ['v*']
    branches: [main]
    paths: ['packaging/**', 'Changelog.md', '.github/workflows/home-runtime.yml']
permissions:
  contents: read
concurrency:
  group: home-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка подготовки и публикации выпусков
        run: python3 -m unittest discover -s packaging -p '*_test.py'
      - name: Проверка тега и changelog до сборки
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 packaging/check-release.py "$GITHUB_REF_NAME"
  verify-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: validate
    uses: ./.github/workflows/server.yml
    with:
      app_ref: ${{ inputs.app_ref || '' }}
  runtime:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сервер и PostgreSQL, проверка перезапуска
        env:
          SPACE_RUNTIME_CANDIDATE_VERSION: ${{ inputs.version || '' }}
        run: python packaging/build-home-runtime.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Проверяемая версия приложения
        id: app-ref
        shell: bash
        env:
          REQUESTED_APP_REF: ${{ inputs.app_ref }}
        run: |
          app_ref="$REQUESTED_APP_REF"
          if [ -z "$app_ref" ]; then app_ref=$(cat .github/space-app.ref); fi
          echo "ref=$app_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: app-source
      - name: Сквозной запуск, владелец и приглашённый участник через TLS
        working-directory: app-source/client
        run: |
          flutter pub get
          dart run tool/home_server_drill.dart ../../dist/home
      - name: Запуск без компьютера владельца и несколько администраторов
        working-directory: app-source/client
        run: dart run tool/standalone_server_drill.dart ../../dist/home
      - name: Обновление Connect runtime и восстановление данных
        working-directory: app-source/client
        env:
          SPACE_HOME_UPGRADE_CHECK: '1'
          SPACE_HOME_CANDIDATE_DIRECTORY: '../../dist'
        run: flutter test --no-pub test/home_runtime_upgrade_test.dart
      - name: Перенос пространства со сменой адреса и восстановлением владельца
        working-directory: app-source/client
        run: dart run tool/home_transfer_drill.dart ../../dist/home
      - name: Rust для проверки восстановления MLS
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Три устройства MLS, зашифрованное вложение и старый архив
        working-directory: app-source/client
        shell: bash
        run: |
          SPACE_HOME_RUNTIME="$(python -c 'import os; print(os.path.abspath("../../dist/home"))')"
          export SPACE_HOME_RUNTIME
          executable=space-server
          if [ "$RUNNER_OS" = Windows ]; then executable=space-server.exe; fi
          export SPACE_RESTORE_EXECUTABLE="$SPACE_HOME_RUNTIME/$executable"
          flutter test --no-pub test/live/mls_restore_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: home-runtime-${{ matrix.os }}
          path: |
            dist/Space-home-*.zip
            dist/*-x64.json
            dist/*-arm64.json
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, runtime, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: home-runtime-*
          path: dist
          merge-multiple: true
      - name: Описание из Changelog.md
        run: python3 packaging/release-notes.py "$GITHUB_REF_NAME" Changelog.md dist/release-notes.md
      - name: Публикация комплекта домашнего сервера
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/publish-release.py server "$GITHUB_REF_NAME" dist
