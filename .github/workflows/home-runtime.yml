name: Домашний сервер без Docker
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/server.yml
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сервер и PostgreSQL, проверка перезапуска
        run: python packaging/build-home-runtime.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-app
          path: app-source
      - name: Сквозной запуск, владелец и приглашённый участник через TLS
        working-directory: app-source/client
        run: |
          flutter pub get
          dart run tool/home_server_drill.dart ../../dist/home
      - uses: actions/upload-artifact@v4
        with:
          name: home-runtime-${{ matrix.os }}
          path: |
            dist/Space-home-*.zip
            dist/*-x64.json
            dist/*-arm64.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [runtime, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: home-runtime-*
          path: dist
          merge-multiple: true
      - name: Описание из Changelog.md
        run: python3 packaging/release-notes.py "$GITHUB_REF_NAME" Changelog.md dist/release-notes.md
      - name: Публикация комплекта домашнего сервера
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          (cd dist && sha256sum Space-home-*.zip > SHA256SUMS.txt)
          files=(dist/Space-home-*.zip dist/*-x64.json dist/*-arm64.json dist/SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "Домашний сервер $GITHUB_REF_NAME" --notes-file dist/release-notes.md --prerelease --latest=false
          gh release edit "$GITHUB_REF_NAME" --draft=false
