name: P1 постоянный план миграции и восстановление
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Анализ и зависимости
        run: |
          mkdir -p .local/upgrade-recovery
          gofmt -w internal/postgres/extensions_p1_upgrade*.go
          git diff --exit-code
          go mod verify
          go vet ./...
      - name: Постоянный журнал и аварийные перезапуски
        run: |
          go test -race -json ./internal/postgres -run '^TestExtensionP1Upgrade' -count=5 -timeout=8m > .local/upgrade-recovery/recovery.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          events=[json.loads(x) for x in Path('.local/upgrade-recovery/recovery.jsonl').read_text().splitlines()]
          assert not any(e['Action'] in ('skip','fail') for e in events)
          for name in ('PersistentResume','Rollback','ConcurrentStep','Permissions','CorruptJournal','ProcessRecovery','UncertainCommit'):
              assert sum(e['Action']=='pass' and e.get('Test')=='TestExtensionP1Upgrade'+name for e in events)==5
          for mode in ('prepared','during_step','after_commit'):
              assert sum(e['Action']=='pass' and e.get('Test')=='TestExtensionP1UpgradeProcessRecovery/'+mode for e in events)==5
          PY
      - name: Регрессия сервера
        run: |
          go test -json ./... > .local/upgrade-recovery/server.jsonl
          go test -race -json ./... > .local/upgrade-recovery/server-race.jsonl
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./internal/postgres ./internal/extensionp1 ./internal/home > .local/upgrade-recovery/vulnerabilities.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-upgrade-recovery
          path: .local/upgrade-recovery
          include-hidden-files: true
