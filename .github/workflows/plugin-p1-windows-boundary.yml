name: P1 Windows network and profile boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/install_p1_linux_deps.sh wabt
      - run: python3 experiments/extensions/fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-fixtures
          path: experiments/extensions/testdata
  modules:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/extensions
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boundary-fixtures
          path: experiments/extensions/testdata
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/extensions/go.mod
          cache-dependency-path: experiments/extensions/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 -timeout=180s -json ./... > boundary-tests.jsonl
      - run: go test -race -count=1 -timeout=180s -json ./... > boundary-race.jsonl
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-modules-${{ matrix.os }}
          path: |
            experiments/extensions/boundary-tests.jsonl
            experiments/extensions/boundary-race.jsonl
  windows:
    needs: fixtures
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/extensions
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boundary-fixtures
          path: experiments/extensions/testdata
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/extensions/go.mod
          cache-dependency-path: experiments/extensions/go.sum
      - name: Winsock и запрет без сетевых capabilities
        run: |
          go build -o p1-rights.exe ./cmd/p1-rights
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o p1-worker.exe ./cmd/p1-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o p1-pressure.exe ./cmd/p1-pressure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:P1_RIGHTS = Join-Path $PWD 'p1-rights.exe'
          $env:P1_WORKER = Join-Path $PWD 'p1-worker.exe'
          $env:P1_PRESSURE = Join-Path $PWD 'p1-pressure.exe'
          go test -race -count=3 -timeout=180s -json -run '^TestWindowsRestricted(WinsockReady|NetworkMatrix|ProfileReadOnly|SeparateProfiles)$' . > windows-boundary.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race -count=1 -timeout=240s -json -run '^TestWindows(Isolation|Restricted)' . > windows-regression.jsonl
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-boundary
          path: |
            experiments/extensions/windows-boundary.jsonl
            experiments/extensions/windows-regression.jsonl
