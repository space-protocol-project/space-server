name: P2 встроенный реестр и адаптеры
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        suite: [registry, regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p .local/p2-registry
      - name: Реестр, адаптеры, ACL, транзакции и миграция
        if: matrix.suite == 'registry'
        run: |
          go test -race -json ./internal/postgres -run '^TestBuiltinRegistry' -count=5 -timeout=10m > .local/p2-registry/registry.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(s) for s in Path('.local/p2-registry/registry.jsonl').read_text().splitlines()]
          assert not any(r['Action'] in ('skip','fail') for r in rows)
          for name in ('Adapters','Authority','Transaction','Upgrade','Visibility'):
              assert sum(r['Action']=='pass' and r.get('Test')=='TestBuiltinRegistry'+name for r in rows)==5,name
          PY
      - name: Полное ядро и анализ
        if: matrix.suite == 'regression'
        run: |
          go test -json ./... > .local/p2-registry/core.jsonl
          go test -race -json ./... > .local/p2-registry/core-race.jsonl
          go vet ./...
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Ревизия стенда
        if: always()
        run: |
          git rev-parse HEAD > .local/p2-registry/server-sha.txt
          go version > .local/p2-registry/go-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-${{ matrix.suite }}
          path: .local/p2-registry
          include-hidden-files: true
          retention-days: 7
