name: Проверка сервера
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Коммит приложения для проверки совместимой пары
        type: string
        default: ''
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      app_ref:
        description: Коммит или тег проверяемого приложения
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: space_test
          POSTGRES_USER: space
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space -d space_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SPACE_APP_DIR: app-source/client
      SPACE_TEST_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: ${{ github.repository == 'space-protocol-project/space-server' && github.sha || 'main' }}
      - name: Проверяемая версия приложения
        id: app-ref
        shell: bash
        env:
          REQUESTED_APP_REF: ${{ inputs.app_ref }}
        run: |
          app_ref="$REQUESTED_APP_REF"
          if [ -z "$app_ref" ]; then app_ref=$(cat .github/space-app.ref); fi
          echo "ref=$app_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: app-source
      - name: Проверка конфигурации локальной базы
        env:
          SPACE_POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Проверки UI-прототипа и согласия на оформление
        run: |
          python3 -m unittest discover -s packaging -p '*_test.py'
          npm ci --prefix tools
          node tools/qr.test.mjs
          node --check app-source/client/design/prototype/app.js
          node --check app-source/client/design/prototype/theme.js
          node app-source/client/design/prototype/theme.test.mjs
          node --check tools/crypto_reference/identity.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Тесты с проверкой гонок
        working-directory: .
        run: |
          go test ./...
          go test -race ./...
      - name: Повторение конкурентной остановки и смены фазы RTP
        run: |
          go test -race ./cmd/space-server -run 'Test(Drain|RPCDrain|CleanupTimeout)' -count=20
          go test -race ./internal/voice -run '^TestThirtyTwoSimultaneousSpeakersAndSlotReuse$' -count=5
      - name: Статический анализ
        working-directory: .
        run: |
          go vet ./...
          go mod verify
      - name: Уязвимые вызовы Go и полный отчёт о зависимостях
        # Проверяем достижимый код, включая стандартную библиотеку. Полный
        # отчёт сохраняет и предупреждения о неиспользуемых пакетах модуля.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -C cmd/space-server -show=verbose ./...
      - name: Системные зависимости нативных модулей Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Анализ и тесты Flutter-клиента
        working-directory: app-source/client
        run: |
          flutter pub get
          dart run tool/core_import_check.dart
          flutter analyze
          flutter test
      - name: Сквозная проверка входа, событий и отзыва
        working-directory: .
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_test?sslmode=disable
        run: |
          go build -o "$RUNNER_TEMP/space-server" ./cmd/space-server
          SPACE_SETUP_CODE=$("$RUNNER_TEMP/space-server" -setup-code)
          echo "::add-mask::$SPACE_SETUP_CODE"
          export SPACE_SETUP_CODE
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18080 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          go run ./cmd/space-demo -origin http://127.0.0.1:18080
          node tools/admin-interop.mjs
          node tools/root-rotation-interop.mjs
          cd app-source/client
          dart run tool/interoperability.dart http://127.0.0.1:18080
          dart run tool/connect_interoperability.dart http://127.0.0.1:18080
      - name: Первый владелец без кода из нативного приложения
        working-directory: .
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_first_owner?sslmode=disable
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U space -d space_test -c 'CREATE DATABASE space_first_owner'
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18081 -grpc 127.0.0.1:19091 &
          bootstrap_pid=$!
          trap 'kill "$bootstrap_pid"; wait "$bootstrap_pid" || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 1
          done
          cd app-source/client
          dart run tool/first_owner_interoperability.dart http://127.0.0.1:18081
      - name: Ручное назначение владельца из основного приложения
        working-directory: .
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_manual_owner?sslmode=disable
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U space -d space_test -c 'CREATE DATABASE space_manual_owner'
          SPACE_SETUP_CODE=$("$RUNNER_TEMP/space-server" -setup-code)
          echo "::add-mask::$SPACE_SETUP_CODE"
          export SPACE_SETUP_CODE
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18082 -grpc 127.0.0.1:19092 &
          bootstrap_pid=$!
          trap 'kill "$bootstrap_pid"; wait "$bootstrap_pid" || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18082/healthz; then break; fi
            sleep 1
          done
          cd app-source/client
          dart run tool/manual_owner_interoperability.dart http://127.0.0.1:18082
      - name: Вложения и профили — два настоящих клиента
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_attachments?sslmode=disable
          SPACE_ATTACHMENTS_TEST_ORIGIN: http://127.0.0.1:18083
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U space -d space_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE space_attachments'
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18083 -grpc 127.0.0.1:19093 &
          attachments_pid=$!
          trap 'kill "$attachments_pid"; wait "$attachments_pid" || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18083/healthz; then break; fi
            sleep 1
          done
          cd app-source/client
          flutter test test/live/attachments_server_test.dart --reporter expanded
      - name: Лента, поиск, сводка и отзыв доступа — совместимый клиент
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_feed?sslmode=disable
          SPACE_FEED_TEST_ORIGIN: http://127.0.0.1:18085
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U space -d space_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE space_feed'
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18085 -grpc 127.0.0.1:19095 &
          feed_pid=$!
          trap 'kill "$feed_pid"; wait "$feed_pid" || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18085/healthz; then break; fi
            sleep 1
          done
          cd app-source/client
          flutter test --no-pub test/live/feed_server_test.dart --reporter expanded
      - name: Закрытый MLS-канал, файлы и сохранение устройств при смене root
        env:
          SPACE_DATABASE_URL: postgres://space:ci-only-password@127.0.0.1:5432/space_mls?sslmode=disable
          SPACE_MLS_TEST_ORIGIN: http://127.0.0.1:18084
        run: |
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U space -d space_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE space_mls'
          "$RUNNER_TEMP/space-server" -http 127.0.0.1:18084 -grpc 127.0.0.1:19094 &
          mls_pid=$!
          trap 'kill "$mls_pid"; wait "$mls_pid" || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18084/healthz; then break; fi
            sleep 1
          done
          cd app-source/client
          flutter test test/live/mls_server_test.dart --reporter expanded
      - name: Реакции, избранное, поиск и социальная лента — настоящие клиенты и перезапуск
        shell: bash
        run: |
          for scenario in reactions favorites space_search feed_social participant_follows; do
            database="space_community_${scenario}"
            PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U space -d space_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            SPACE_DATABASE_URL="postgres://space:ci-only-password@127.0.0.1:5432/$database?sslmode=disable" \
              python3 app-source/tools/check_community_interop.py \
              --server "$RUNNER_TEMP/space-server" --client app-source/client \
              --scenario "$scenario" --output "$RUNNER_TEMP/community-$scenario"
          done
      - name: Журналы сообществ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-interop-logs
          path: ${{ runner.temp }}/community-*/interop.log
          if-no-files-found: warn
          retention-days: 14
  native-vault:
    name: Нативное хранилище Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-server
          ref: ${{ github.repository == 'space-protocol-project/space-server' && github.sha || 'main' }}
      - name: Проверяемая версия приложения
        id: app-ref
        shell: bash
        env:
          REQUESTED_APP_REF: ${{ inputs.app_ref }}
        run: |
          app_ref="$REQUESTED_APP_REF"
          if [ -z "$app_ref" ]; then app_ref=$(cat .github/space-app.ref); fi
          echo "ref=$app_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: space-protocol-project/space-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: app-source
      - name: Системные зависимости нативных модулей Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Сборка отдельного проверочного приложения
        working-directory: app-source/client
        run: |
          flutter pub get
          flutter build windows --release --target tool/native_vault_drill.dart --dart-define=SPACE_VAULT_CRASH_TEST=true
      - name: Перезапуск с настоящим системным vault
        working-directory: app-source/client
        run: ./tool/native_vault_drill.ps1
