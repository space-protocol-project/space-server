name: Автозапуск systemd
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['packaging/install*', 'packaging/verify-systemd.py', '.github/workflows/systemd.yml']
  pull_request:
    paths: ['packaging/install*', 'packaging/verify-systemd.py', '.github/workflows/systemd.yml']
permissions:
  contents: read
jobs:
  systemd:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверки установщика и аргументов
        run: |
          sh -n packaging/install.sh
          python3 -m unittest discover -s packaging -p 'install_test.py' -v
      - name: Отдельный пользователь с автозапуском без сеанса
        run: |
          sudo useradd --create-home --shell /bin/bash space-systemd-ci
          uid=$(id -u space-systemd-ci)
          # В образе включён глобальный автозапуск rootless Podman.
          # Тестовый менеджер должен запускать только проверяемую службу.
          sudo -u space-systemd-ci mkdir -p /home/space-systemd-ci/.config/systemd/user
          sudo -u space-systemd-ci ln -s /dev/null /home/space-systemd-ci/.config/systemd/user/podman.service
          sudo -u space-systemd-ci ln -s /dev/null /home/space-systemd-ci/.config/systemd/user/podman.socket
          # Образ Actions задаёт XDG-пути runner в /etc/environment.
          # Они не должны наследоваться менеджером другого пользователя.
          sudo sed -i '/^XDG_/d; /^DBUS_SESSION_BUS_ADDRESS=/d' /etc/environment
          sudo mkdir -p "/etc/systemd/system/user@$uid.service.d"
          printf '[Service]\nEnvironment=HOME=/home/space-systemd-ci\nEnvironment=XDG_RUNTIME_DIR=/run/user/%s\nEnvironment=XDG_CONFIG_HOME=/home/space-systemd-ci/.config\nEnvironment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$uid" "$uid" | sudo tee "/etc/systemd/system/user@$uid.service.d/space-ci.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger space-systemd-ci
          sudo systemctl start "user@$uid.service"
          sudo install -m 644 packaging/install.sh /tmp/space-systemd-install.sh
      - name: Настоящие systemd и опубликованный runtime
        run: sudo python3 packaging/verify-systemd.py
      - name: Диагностика сбоя systemd
        if: failure()
        run: |
          if id space-systemd-ci >/dev/null 2>&1; then
            uid=$(id -u space-systemd-ci)
            sudo journalctl -u "user@$uid.service" -n 70 --no-pager
            sudo journalctl "_UID=$uid" -n 100 --no-pager | sed -E 's/setup_[A-Za-z0-9_-]+/[SECRET]/g'
          fi
      - name: Остановка тестовой службы
        if: always()
        run: |
          if id space-systemd-ci >/dev/null 2>&1; then
            sudo systemctl stop "user@$(id -u space-systemd-ci).service"
            sudo loginctl disable-linger space-systemd-ci
          fi
