services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: space
      POSTGRES_USER: space
      POSTGRES_PASSWORD: ${SPACE_POSTGRES_PASSWORD:?Задайте SPACE_POSTGRES_PASSWORD в deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - space-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space -d space"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  space-postgres:
